name: V3 integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-jido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
      - name: Resolve dependencies
        run: mix deps.get
      - name: Check format, compile, and test
        run: |
          mix quality
          mix test --cover --warnings-as-errors
      - name: Build docs and run chart cases
        run: |
          mix docs --warnings-as-errors
          mix statechart.w3c test/fixtures/w3c/355/test355.txml
      - name: Check compile dependencies and diff
        run: |
          mix xref graph --format cycles --label compile-connected
          git diff --check
