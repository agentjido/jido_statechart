name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ci:
    name: CI (OTP ${{ matrix.otp }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "27"
            elixir_versions: '["1.18", "1.19"]'
          - otp: "29"
            elixir_versions: '["1.20"]'
    uses: agentjido/github-actions/.github/workflows/jido-ci.yml@v4
    with:
      quality_otp_version: "29"
      quality_elixir_version: "1.20"
      otp_versions: ${{ format('["{0}"]', matrix.otp) }}
      elixir_versions: ${{ matrix.elixir_versions }}
      credo_command: mix credo --min-priority high
      docs_command: mix doctor --raise && mix docs --warnings-as-errors
      test_command: mix coveralls --warnings-as-errors && mix statechart.w3c --manifest test/fixtures/w3c/manifest.xml
      # Enable when Hex Jido includes Flow bodies for Iterate.
      validate_hex_package: false
