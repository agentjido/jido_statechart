name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      operation:
        description: Release operation
        type: choice
        default: auto
        options: [auto, prepare, publish]
      tag_name:
        description: Optional v-prefixed tag for publish simulation
        type: string
      dry_run:
        description: Verify without pushing or publishing
        type: boolean
        default: true
      hex_dry_run:
        description: Complete GitHub release steps with a Hex publish dry run
        type: boolean
        default: false
      version_override:
        description: Optional bare SemVer override
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: agentjido/github-actions/.github/workflows/jido-release.yml@v4
    with:
      otp_version: "29"
      elixir_version: "1.20"
      operation: ${{ inputs.operation || 'auto' }}
      tag_name: ${{ inputs.tag_name || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      hex_dry_run: ${{ inputs.hex_dry_run || false }}
      version_override: ${{ inputs.version_override || '' }}
      preflight_command: mix hex.audit && mix hex.build --output "$RUNNER_TEMP/jido_statechart.tar" && MIX_ENV=test mix coveralls --warnings-as-errors
    secrets: inherit
